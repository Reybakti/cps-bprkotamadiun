name: Continuous Integration

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://cpsapps:cps123admin@localhost:5432/cps_db?schema=public"
      AUTH_SECRET: "ci-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build